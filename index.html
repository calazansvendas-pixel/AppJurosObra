        // ==========================================
        // COMPONENTE DE INPUT DE MOEDA (BRL)
        // ==========================================
        const MoneyInput = ({ label, value, onChange, placeholder = "0,00", helpText, id }) => {
            const [focused, setFocused] = useState(false);
            const [displayVal, setDisplayVal] = useState('');

            useEffect(() => {
                if (!focused) {
                    if (value === '' || value === null || value === undefined || isNaN(value)) {
                        setDisplayVal('');
                    } else {
                        const num = parseFloat(value);
                        setDisplayVal(num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                    }
                }
            }, [value, focused]);

            const handleFocus = () => {
                setFocused(true);
                if (value !== '' && value !== null && !isNaN(value)) {
                    setDisplayVal(String(value).replace('.', ','));
                }
            };

            const handleChange = (e) => {
                const raw = e.target.value;
                setDisplayVal(raw);
                
                if (!raw.trim()) {
                    onChange('');
                    return;
                }

                const cleanStr = raw.replace(/\./g, '').replace(',', '.');
                const parsed = parseFloat(cleanStr);
                if (!isNaN(parsed)) {
                    onChange(parsed);
                } else {
                    onChange('');
                }
            };

            const handleBlur = () => {
                setFocused(false);
                const num = parseFloat(value);
                if (!isNaN(num) && value !== '') {
                    setDisplayVal(num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                } else {
                    setDisplayVal('');
                }
            };

            return (
                <div>
                    {label && <label className="block text-sm font-semibold text-slate-700 mb-1">{label}</label>}
                    <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">R$</span>
                        <input 
                            type="text" 
                            id={id}
                            value={displayVal} 
                            onChange={handleChange}
                            onFocus={handleFocus}
                            onBlur={handleBlur}
                            placeholder={placeholder}
                            className="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none transition-all font-semibold text-slate-800"
                        />
                    </div>
                    {helpText && <p className="text-xs text-slate-500 mt-1">{helpText}</p>}
                </div>
            );

        // ==========================================
        // APLICAÇÃO PRINCIPAL
        // ==========================================
        function App() {
            // Estado e lógica de troca de Tema (Modo Claro vs Modo Escuro)
            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem('app_theme');
                return saved === 'escuro' ? 'escuro' : 'claro';
            });

            // Aplica/Remove a classe 'dark' e o atributo data-theme nas tags HTML e BODY
            useEffect(() => {
                const rootEl = document.documentElement;
                const bodyEl = document.body;
                localStorage.setItem('app_theme', theme);

                if (theme === 'escuro') {
                    rootEl.classList.add('dark');
                    bodyEl.classList.add('dark');
                    rootEl.setAttribute('data-theme', 'dark');
                    bodyEl.setAttribute('data-theme', 'dark');
                } else {
                    rootEl.classList.remove('dark');
                    bodyEl.classList.remove('dark');
                    rootEl.removeAttribute('data-theme');
                    bodyEl.removeAttribute('data-theme');
                }
            }, [theme]);

            // Estados para os inputs do usuário
            const [financiamento, setFinanciamento] = useState('');
            const [taxaAnual, setTaxaAnual] = useState('');
            const [percTerreno, setPercTerreno] = useState('6.9'); // Valor fixo por padrão em 6,9%
            const [percObra, setPercObra] = useState('');
            const [parcelaFutura, setParcelaFutura] = useState('');
            const [seguro, setSeguro] = useState('');

            // Estado para armazenar o resultado da simulação calculada sob demanda
            const [resultadoSimulacao, setResultadoSimulacao] = useState(null);

            // Função auxiliar que limpa o resultado anterior ao alterar qualquer campo
            const updateInputVal = (setter) => (val) => {
                setter(val);
                setResultadoSimulacao(null);
            };
            
            // Estados para a API do Banco Central (TR)
            const [tr, setTr] = useState(0);
            const [trData, setTrData] = useState('Buscando...');
            const [isFetchingTr, setIsFetchingTr] = useState(true);
            const [showTrTooltip, setShowTrTooltip] = useState(false);

            // Helper para formatar o período de referência da TR
            const formatTrPeriodo = (dataStr) => {

                if (dataStr.includes('/')) {
                    const parts = dataStr.split('/');
                    if (parts.length === 3) {
                        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                        const mIndex = parseInt(parts[1], 10) - 1;
                        if (mIndex >= 0 && mIndex < 12) {
                            return `Ref. ${meses[mIndex]}/${parts[2]}`;
                        }
                    }
                }
                return `Ref. ${dataStr}`;

            const [filterPerfilUsuarios, setFilterPerfilUsuarios] = useState('Todos');

            // Map de prioridade dos perfis para ordenação sequencial
            const PERFIL_HIERARQUIA_ORDEM = {
                'Administrador': 1,
                'Gerente': 2,
                'Analista': 3,
                'Assistente': 4,
                'Corretor': 5
            };

            // Filtro dinâmico e ordenação da lista de usuários por busca, perfil e ordem alfabética
            const usuariosFiltrados = listaUsuarios
                .filter((u) => {
                    const term = searchTermUsuarios.toLowerCase().trim();
                    const matchesSearch = !term || 
                        (u.nome && u.nome.toLowerCase().includes(term)) || 
                        (u.email && u.email.toLowerCase().includes(term));
                    const matchesPerfil = filterPerfilUsuarios === 'Todos' || u.perfil === filterPerfilUsuarios;
                    return matchesSearch && matchesPerfil;
                })
                .sort((a, b) => {
                    const rankA = PERFIL_HIERARQUIA_ORDEM[a.perfil] || 99;
                    const rankB = PERFIL_HIERARQUIA_ORDEM[b.perfil] || 99;
                    if (rankA !== rankB) {
                        return rankA - rankB;
                    }
                    const nomeA = (a.nome || a.email || '').trim();
                    const nomeB = (b.nome || b.email || '').trim();
                    return nomeA.localeCompare(nomeB, 'pt-BR', { sensitivity: 'base' });
                });

            // Taxa de administração fixa conforme regra da CEF
            const TAXA_ADM = 25.00;

            // Permissão de edição para campos restritos (TR e Percentual do Terreno)

            const canEditCamposRestritos = userData?.perfil === 'Administrador' || userData?.perfil === 'Gerente';

            // Monitora estado de autenticação do Firebase
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (user) => {
                    setCurrentUser(user);

                        try {
                            const userDocRef = doc(db, 'usuarios', user.uid);

            // Carrega lista de usuários para o perfil Administrador
            useEffect(() => {
                if (userData && userData.perfil === 'Administrador') {

                    const unsubscribe = onSnapshot(collection(db, 'usuarios'), (snapshot) => {
                        const usersArr = [];

            useEffect(() => {
                if (!currentUser) {
                    setSimulacoes([]);
                    setIsLoadingSimulacoes(false);
                    return;
                }

                setIsLoadingSimulacoes(true);
                const isCorretor = userData?.perfil === 'Corretor';

                try {
                    const baseRef = collection(db, 'simulacoes');
                    // Para Corretor: filtra na consulta do Firestore por criadoPorUid == user.uid
                    // Para os demais perfis (Administrador, Gerente, Assistente, Analista): consulta global de todas as simulações
                    const q = isCorretor 
                        ? query(baseRef, where('criadoPorUid', '==', currentUser.uid))
                        : query(baseRef, orderBy('criadoEm', 'desc'));

                    const unsubscribe = onSnapshot(q, (snapshot) => {
                        const lista = [];
                        snapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            if (isCorretor) {
                                // Garantia dupla de segurança no cliente para perfis de Corretor
                                if (data.criadoPorUid === currentUser.uid || data.userId === currentUser.uid || data.criadoPorEmail === currentUser.email || !data.criadoPorUid) {
                                    lista.push({ id: docSnap.id, ...data });
                                }
                            } else {
                                lista.push({ id: docSnap.id, ...data });
                            }
                        });

                        // Ordenação cronológica (mais recentes primeiro)
                        lista.sort((a, b) => {
                            const timeA = a.criadoEm?.seconds || 0;
                            const timeB = b.criadoEm?.seconds || 0;
                            return timeB - timeA;
                        });

                        setSimulacoes(lista);
                        setIsLoadingSimulacoes(false);
                    }, (error) => {
                        console.warn('Fallback no snapshot de simulações:', error);
                        // Fallback sem ordenação composta caso o índice do Firestore esteja em criação
                        const fallbackRef = isCorretor 
                            ? query(collection(db, 'simulacoes'), where('criadoPorEmail', '==', currentUser.email))
                            : collection(db, 'simulacoes');

                        onSnapshot(fallbackRef, (snapshot) => {
                            const lista = [];
                            snapshot.forEach((docSnap) => {
                                const data = docSnap.data();
                                if (isCorretor) {
                                    if (data.criadoPorUid === currentUser.uid || data.userId === currentUser.uid || data.criadoPorEmail === currentUser.email) {
                                        lista.push({ id: docSnap.id, ...data });
                                    }
                                } else {
                                    lista.push({ id: docSnap.id, ...data });
                                }
                            });
                            lista.sort((a, b) => (b.criadoEm?.seconds || 0) - (a.criadoEm?.seconds || 0));
                            setSimulacoes(lista);
                            setIsLoadingSimulacoes(false);
                        });
                    });

                    return () => unsubscribe();
                } catch (err) {
                    console.error('Erro ao conectar ao Firestore:', err);
                    setIsLoadingSimulacoes(false);
                }
            }, [userData, currentUser]);

            const fetchTR = async () => {
                setIsFetchingTr(true);
                try {
                    let response = await fetch('/api/tr').catch(() => null);
                    if (!response || !response.ok) {
                        response = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.226/dados/ultimos/1?formato=json');
                    }
                    const data = await response.json();
                    if (data && data.length > 0) {
                        setTr(parseFloat(data[0].valor));
                        setTrData(data[0].data);
                    }
                } catch (error) {
                    console.error('Erro ao buscar TR:', error);

                finally {
                    setIsFetchingTr(false);

            // Handlers de Autenticação
            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                if (!authEmail.trim() || !authPassword) {
                    setAuthError('Preencha e-mail e senha para acessar.');
                    return;
                }
                setAuthSubmitting(true);
                try {
                    await signInWithEmailAndPassword(auth, authEmail.trim(), authPassword);
                    setAuthEmail('');
                    setAuthPassword('');
                } catch (err) {
                    console.error("Erro de Login:", err);
                    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                        setAuthError('E-mail ou senha incorretos.');
                    } else if (err.code === 'auth/invalid-email') {
                        setAuthError('Formato de e-mail inválido.');
                    } else if (err.code === 'auth/too-many-requests') {
                        setAuthError('Muitas tentativas sem sucesso. Tente novamente mais tarde.');
                    } else {
                        setAuthError(`Erro ao entrar: ${err.message || err.code || 'Falha de autenticação.'}`);
                    }
                } finally {
                    setAuthSubmitting(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthError('');
                if (!authNome.trim()) {
                    setAuthError('Informe o seu Nome Completo.');
                    return;
                }
                if (!authEmail.trim()) {
                    setAuthError('Informe o seu E-mail.');
                    return;
                }
                if (!authCelular.trim()) {
                    setAuthError('Informe o seu Celular / WhatsApp.');
                    return;
                }
                if (!authCreci.trim()) {
                    setAuthError('Informe o seu registro CRECI.');
                    return;
                }
                if (!authPassword || authPassword.length < 6) {
                    setAuthError('A senha deve ter no mínimo 6 caracteres.');
                    return;
                }
                setAuthSubmitting(true);
                try {
                    // 1. Cria conta no Firebase Authentication
                    const userCred = await createUserWithEmailAndPassword(auth, authEmail.trim(), authPassword);
                    const user = userCred.user;

                    // 2. Atualiza o perfil do Firebase Auth (displayName)
                    try {
                        await updateProfile(user, { displayName: authNome.trim() });
                    } catch (pErr) {
                        console.warn("Aviso ao atualizar displayName no Auth:", pErr);
                    }
                    
                    // 3. Salva os dados estendidos do usuário e perfil no Firestore (coleção 'usuarios')
                    const profileData = {
                        nome: authNome.trim(),
                        email: authEmail.trim(),
                        celular: authCelular.trim(),
                        creci: authCreci.trim(),
                        perfil: authPerfil,
                        status: 'Ativo',
                        uid: user.uid,
                        criadoEm: serverTimestamp()
                    };
                    
                    await setDoc(doc(db, 'usuarios', user.uid), profileData);
                    
                    // 4. Atualiza os estados locais para liberação e navegação imediata
                    setUserData(profileData);
                    setCurrentUser(user);
                    setAuthEmail('');
                    setAuthPassword('');
                    setAuthNome('');
                    setAuthCelular('');
                    setAuthCreci('');
                } catch (err) {
                    console.error("Erro no Cadastro:", err);
                    if (err.code === 'auth/email-already-in-use') {
                        setAuthError('Este e-mail já está cadastrado no sistema.');

                        setAuthError('A senha deve ter pelo menos 6 caracteres.');

                        setAuthError('O e-mail digitado é inválido.');
                    } else if (err.code === 'auth/operation-not-allowed') {
                        setAuthError('O método de autenticação por E-mail/Senha não está ativado no Firebase.');
                    } else {
                        setAuthError(`Erro no cadastro: ${err.message || err.code || 'Ocorreu uma falha ao criar a conta.'}`);

                setTaxaAnual('');

            // Funções utilitárias de formatação
            const formatCurrency = (value) => {
                const num = parseFloat(value);
                if (isNaN(num)) return 'R$ 0,00';
                return new Intl.NumberFormat('pt-BR', { 
                    style: 'currency', 
                    currency: 'BRL',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(num);
            };
            
            const formatPercent = (value, decimals = 2) => {
                const num = parseFloat(value);
                if (isNaN(num)) return '0,00%';
                return `${num.toLocaleString('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}%`;
            };

            // ==========================================
            // MOTOR DE CÁLCULO SOB DEMANDA
            // ==========================================
            const handleCalcularSimulacao = () => {
                if (!financiamento || parseFloat(financiamento) <= 0) {
                    alert('Por favor, informe o Valor do Financiamento para realizar o cálculo da simulação.');
                    return;
                }

                const fin = parseFloat(financiamento || 0);
                const taxaA = parseFloat(taxaAnual || 0);
                const pTerr = parseFloat(percTerreno || 0);
                const pObra = parseFloat(percObra || 0);
                const parcFut = parseFloat(parcelaFutura || 0);
                const seg = parseFloat(seguro || 0);
                const trVal = parseFloat(tr || 0);

                const percTotalLiberado = pTerr + pObra;
                const saldoLiberado = fin * (percTotalLiberado / 100);
                
                const taxaMensal = taxaA / 12;
                const valorJuros = saldoLiberado * (taxaMensal / 100);
                const valorTr = saldoLiberado * (trVal / 100);
                
                const totalParcela = valorJuros + valorTr + seg + TAXA_ADM;
                const tetoAlcancado = parcFut > 0 ? (totalParcela / parcFut) * 100 : 0;

                setResultadoSimulacao({
                    financiamento: fin,
                    taxaAnual: taxaA,
                    percTerreno: pTerr,
                    percObra: pObra,
                    parcelaFutura: parcFut,
                    seguro: seg,
                    tr: trVal,
                    percTotalLiberado,
                    saldoLiberado,
                    taxaMensal,
                    valorJuros,
                    valorTr,
                    totalParcela,
                    tetoAlcancado
                });

                setFeedback({ text: 'Simulação calculada com sucesso!', type: 'success' });
                setTimeout(() => setFeedback(null), 3000);
            };

            // ==========================================
            // AÇÕES DO FIRESTORE (SALVAR, CARREGAR, EXCLUIR)
            // ==========================================
            const handleSalvarSimulacao = async () => {
                if (!resultadoSimulacao) {
                    alert('Por favor, preencha os dados e clique em "Calcular Simulação" antes de salvar no banco de dados.');
                    return;
                }

                setIsSaving(true);
                try {
                    const agora = new Date();
                    const dataTexto = agora.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    const tituloFinal = nomeSimulacao.trim() 
                        ? nomeSimulacao.trim() 
                        : `Simulação ${formatCurrency(resultadoSimulacao.financiamento)} (${dataTexto})`;

                    const payload = {
                        titulo: tituloFinal,
                        financiamento: resultadoSimulacao.financiamento,
                        taxaAnual: resultadoSimulacao.taxaAnual,
                        percTerreno: resultadoSimulacao.percTerreno,
                        percObra: resultadoSimulacao.percObra,
                        parcelaFutura: resultadoSimulacao.parcelaFutura,
                        seguro: resultadoSimulacao.seguro,
                        tr: resultadoSimulacao.tr,
                        totalParcela: resultadoSimulacao.totalParcela,
                        saldoLiberado: resultadoSimulacao.saldoLiberado,
                        valorJuros: resultadoSimulacao.valorJuros,
                        valorTr: resultadoSimulacao.valorTr,
                        criadoPorUid: currentUser ? currentUser.uid : null,
                        userId: currentUser ? currentUser.uid : null,
                        criadoPorEmail: currentUser ? currentUser.email : null,
                        criadoPorNome: userData ? userData.nome : (currentUser ? currentUser.email : 'Usuário'),
                        criadoPorPerfil: userData ? userData.perfil : 'Corretor',
                        criadoEm: serverTimestamp(),
                        dataTexto: dataTexto
                    };

                    await addDoc(collection(db, 'simulacoes'), payload);
                    
                    setNomeSimulacao('');
                    setFeedback({ text: 'Simulação salva no Firestore com sucesso!', type: 'success' });
                    setTimeout(() => setFeedback(null), 4000);
                } catch (error) {
                    console.error('Erro ao salvar no Firestore:', error);
                    setFeedback({ text: 'Erro ao salvar simulação. Tente novamente.', type: 'error' });
                    setTimeout(() => setFeedback(null), 4000);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleCarregarSimulacao = (item) => {
                const fin = item.financiamento !== undefined ? String(item.financiamento) : '';
                const taxaA = item.taxaAnual !== undefined ? String(item.taxaAnual) : '';
                const pTerr = item.percTerreno !== undefined ? String(item.percTerreno) : '6.9';
                const pObra = item.percObra !== undefined ? String(item.percObra) : '';
                const parcFut = item.parcelaFutura !== undefined ? String(item.parcelaFutura) : '';
                const seg = item.seguro !== undefined ? String(item.seguro) : '';
                const trVal = item.tr !== undefined ? item.tr : tr;

                setFinanciamento(fin);
                setTaxaAnual(taxaA);
                setPercTerreno(pTerr);
                setPercObra(pObra);
                setParcelaFutura(parcFut);
                setSeguro(seg);
                if (item.tr !== undefined) setTr(item.tr);

                // Executa o cálculo e exibe o resultado da simulação carregada
                const numFin = parseFloat(fin || 0);
                const numTaxaA = parseFloat(taxaA || 0);
                const numPTerr = parseFloat(pTerr || 0);
                const numPObra = parseFloat(pObra || 0);
                const numParcFut = parseFloat(parcFut || 0);
                const numSeg = parseFloat(seg || 0);
                const numTr = parseFloat(trVal || 0);

                const percTotalLiberado = numPTerr + numPObra;
                const saldoLiberado = numFin * (percTotalLiberado / 100);
                const taxaMensal = numTaxaA / 12;
                const valorJuros = saldoLiberado * (taxaMensal / 100);
                const valorTr = saldoLiberado * (numTr / 100);
                const totalParcela = valorJuros + valorTr + numSeg + TAXA_ADM;
                const tetoAlcancado = numParcFut > 0 ? (totalParcela / numParcFut) * 100 : 0;

                setResultadoSimulacao({
                    financiamento: numFin,
                    taxaAnual: numTaxaA,
                    percTerreno: numPTerr,
                    percObra: numPObra,
                    parcelaFutura: numParcFut,
                    seguro: numSeg,
                    tr: numTr,
                    percTotalLiberado,
                    saldoLiberado,
                    taxaMensal,
                    valorJuros,
                    valorTr,
                    totalParcela,
                    tetoAlcancado
                });

                window.scrollTo({ top: 0, behavior: 'smooth' });
                setFeedback({ text: `Simulação "${item.titulo}" carregada e calculada na tela!`, type: 'info' });
                setTimeout(() => setFeedback(null), 4000);
            };

            const handleExcluirSimulacao = async (id, titulo) => {
                if (window.confirm(`Deseja excluir permanentemente a simulação "${titulo}"?`)) {
                    try {

                                                    onClick={() => handleExcluirUsuario(u)}
                                                    disabled={isSelf}
                                                    className="py-2 px-2.5 rounded-xl text-xs font-bold transition-all border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 flex items-center justify-center gap-1.5 shadow-2xs disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
                                                    title={isSelf ? 'Você não pode excluir a sua própria conta' : 'Excluir usuário permanentemente'}
                                                >
                                                    <Trash2 size={14} />
                                                    <span>Excluir</span>
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                )}

                {/* MODAL PARA CADASTRAR NOVO USUÁRIO (ADMINISTRADOR) */}
                {showModalNovoUsuario && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
                            {/* Cabeçalho do Modal */}
                            <div className="bg-slate-800 text-white px-6 py-4 flex items-center justify-between">
                                <div className="flex items-center gap-2.5">
                                    <div className="bg-emerald-500/20 p-2 rounded-xl border border-emerald-500/30">
                                        <UserPlus size={20} className="text-emerald-400" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base text-white">Cadastrar Novo Usuário</h3>
                                        <p className="text-xs text-slate-300">Criar conta e definir perfil de acesso direto no sistema</p>
                                    </div>
                                </div>
                                <button 
                                    onClick={() => setShowModalNovoUsuario(false)} 
                                    className="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700/50 transition-colors cursor-pointer"
                                >
                                    <X size={20} />
                                </button>
                            </div>

                            {/* Formulário de Cadastro */}
                            <form onSubmit={handleAdminCadastrarUsuario} className="p-6 space-y-4">
                                {adminNovoError && (
                                    <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs font-semibold flex items-start gap-2">
                                        <AlertOctagon size={16} className="shrink-0 mt-0.5 text-rose-600" />
                                        <span>{adminNovoError}</span>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="col-span-1 sm:col-span-2">
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Nome Completo *</label>
                                        <div className="relative">
                                            <User size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="text"
                                                value={adminNovoNome}
                                                onChange={(e) => setAdminNovoNome(e.target.value)}
                                                placeholder="Ex: Carlos Eduardo Silva"
                                                required
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div className="col-span-1 sm:col-span-2">
                                        <label className="block text-xs font-bold text-slate-700 mb-1">E-mail *</label>
                                        <div className="relative">
                                            <Mail size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="email"
                                                value={adminNovoEmail}
                                                onChange={(e) => setAdminNovoEmail(e.target.value)}
                                                placeholder="corretor@empresa.com.br"
                                                required
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Celular / WhatsApp *</label>
                                        <div className="relative">
                                            <Phone size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="tel"
                                                value={adminNovoCelular}
                                                onChange={(e) => setAdminNovoCelular(e.target.value)}
                                                placeholder="(11) 99999-9999"
                                                required
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">
                                            CRECI {adminNovoPerfil === 'Corretor' ? (
                                                <span className="text-emerald-700 font-bold">* (Obrigatório)</span>
                                            ) : (
                                                <span className="text-slate-400 font-normal">(Opcional)</span>
                                            )}
                                        </label>
                                        <div className="relative">
                                            <Award size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="text"
                                                value={adminNovoCreci}
                                                onChange={(e) => setAdminNovoCreci(e.target.value)}
                                                placeholder="12345-F"
                                                required={adminNovoPerfil === 'Corretor'}
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Senha de Acesso *</label>
                                        <div className="relative">
                                            <Lock size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="password"
                                                value={adminNovoSenha}
                                                onChange={(e) => setAdminNovoSenha(e.target.value)}
                                                placeholder="Mínimo 6 caracteres"
                                                required
                                                minLength={6}
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Perfil de Acesso (Role) *</label>
                                        <select 
                                            value={adminNovoPerfil}
                                            onChange={(e) => setAdminNovoPerfil(e.target.value)}
                                            className="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-semibold text-slate-800 bg-white"
                                        >
                                            <option value="Corretor">Corretor</option>
                                            <option value="Assistente">Assistente</option>
                                            <option value="Analista">Analista</option>
                                            <option value="Gerente">Gerente</option>
                                            <option value="Administrador">Administrador</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                                    <button 
                                        type="button"
                                        onClick={() => setShowModalNovoUsuario(false)}
                                        className="px-4 py-2.5 text-xs font-bold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors cursor-pointer"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        type="submit"
                                        disabled={adminNovoSubmitting}
                                        className="px-5 py-2.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl transition-all shadow-md flex items-center gap-2 disabled:opacity-50 cursor-pointer"
                                    >
                                        {adminNovoSubmitting ? (
                                            <>
                                                <RefreshCw size={14} className="animate-spin" />
                                                Cadastrando...
                                            </>
                                        ) : (
                                            <>
                                                <UserPlus size={16} />
                                                Cadastrar Usuário
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                {/* MODAL DE ALTERAÇÃO / REDEFINIÇÃO DE SENHA DO USUÁRIO (ADMINISTRADOR) */}
                {selectedUserForPassword && (
                    <div className="fixed inset-0 bg-slate-900/75 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
                            {/* Cabeçalho do Modal */}
                            <div className="bg-gradient-to-r from-[#05532C] to-[#1D8843] text-white px-6 py-5 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="bg-white/10 p-2.5 rounded-xl border border-white/20">
                                        <KeyRound size={22} className="text-white" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base leading-tight">Alterar Senha do Usuário</h3>
                                        <p className="text-emerald-100 text-xs font-medium">Gestão de Acessos (Administrador)</p>
                                    </div>
                                </div>
                                <button 
                                    type="button"
                                    onClick={() => setSelectedUserForPassword(null)}
                                    className="text-white/80 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors cursor-pointer"
                                >
                                    <X size={20} />
                                </button>
                            </div>

                            {/* Conteúdo do Modal */}
                            <div className="p-6 space-y-4">
                                {/* Informações do Usuário Selecionado */}
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs space-y-1.5">
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-500 font-medium">Nome:</span>
                                        <span className="font-bold text-slate-800">{selectedUserForPassword.nome || 'Sem Nome'}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-500 font-medium">E-mail Cadastrado:</span>
                                        <span className="font-bold text-slate-800 break-all">{selectedUserForPassword.email}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-500 font-medium">Perfil:</span>
                                        <span className={`px-2 py-0.5 rounded-md font-bold text-[10px] border ${getBadgeStyle(selectedUserForPassword.perfil || 'Corretor')}`}>
                                            {selectedUserForPassword.perfil || 'Corretor'}
                                        </span>
                                    </div>
                                </div>

                                {/* Aviso sobre Criptografia de Senha do Firebase Auth */}
                                <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 space-y-1">
                                    <p className="font-bold flex items-center gap-1.5 text-amber-800">
                                        <Lock size={14} className="text-amber-600 shrink-0" />
                                        Segurança do Firebase Auth:
                                    </p>
                                    <p className="text-amber-700 leading-relaxed text-[11px]">
                                        A senha do usuário é mantida com criptografia irreversível. Para redefinir a senha com segurança, clique abaixo para disparar o e-mail de redefinição para a caixa de entrada do usuário.
                                    </p>
                                </div>

                                {adminPasswordStatus.message && (
                                    <div className={`p-3 rounded-xl text-xs font-semibold flex items-start gap-2.5 ${
                                        adminPasswordStatus.type === 'success' 
                                            ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' 
                                            : 'bg-rose-50 border border-rose-200 text-rose-700'
                                    }`}>
                                        {adminPasswordStatus.type === 'success' ? (
                                            <CheckCircle2 size={16} className="shrink-0 text-emerald-600 mt-0.5" />
                                        ) : (
                                            <Info size={16} className="shrink-0 text-rose-500 mt-0.5" />
                                        )}
                                        <span className="leading-snug">{adminPasswordStatus.message}</span>
                                    </div>
                                )}

                                <div className="pt-2 space-y-3">
                                    <button
                                        type="button"
                                        onClick={() => handleAdminSendResetEmail(selectedUserForPassword.email)}
                                        disabled={isAdminPasswordSubmitting}
                                        className="w-full bg-[#1D8843] hover:bg-[#05532C] text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-xs disabled:opacity-50 cursor-pointer"
                                    >
                                        <Send size={16} />
                                        {isAdminPasswordSubmitting ? 'Disparando e-mail...' : 'Enviar E-mail de Redefinição de Senha'}
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setSelectedUserForPassword(null)}
                                        className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-xl transition-all text-xs cursor-pointer"
                                    >
                                        Fechar Modal
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
