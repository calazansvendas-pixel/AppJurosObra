                                <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                    <Users className="text-emerald-600" size={24} />
                                    Gestão de Usuários e Controle de Acessos (RBAC - Administrador)
                                </h2>
                                <p className="text-slate-500 text-xs mt-1">
                                    Gerencie permissões (Corretor, Assistente, Analista, Gerente, Administrador), pause acessos ou exclua usuários cadastrados no banco de dados.
                                </p>
                            </div>
                            <div className="flex items-center gap-2 self-start md:self-auto shrink-0 flex-wrap">
                                <span className="bg-emerald-50 text-emerald-800 font-bold px-3 py-1.5 rounded-full text-xs border border-emerald-200 flex items-center gap-1.5">
                                    <UserCheck size={14} />
                                    {listaUsuarios.filter(u => u.status !== 'Pausado').length} Ativos
                                </span>
                                {listaUsuarios.filter(u => u.status === 'Pausado').length > 0 && (
                                    <span className="bg-amber-50 text-amber-800 font-bold px-3 py-1.5 rounded-full text-xs border border-amber-200 flex items-center gap-1.5">
                                        <Pause size={14} />
                                        {listaUsuarios.filter(u => u.status === 'Pausado').length} Pausados
                                    </span>
                                )}
                                <span className="bg-slate-100 text-slate-700 font-bold px-3 py-1.5 rounded-full text-xs border border-slate-200">
                                    Total: {listaUsuarios.length}
                                </span>
                                <button
                                    onClick={() => {
                                        setAdminNovoError('');
                                        setShowModalNovoUsuario(true);
                                    }}
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-1.5 rounded-full text-xs flex items-center gap-1.5 shadow-sm transition-all cursor-pointer ml-1"
                                >
                                    <UserPlus size={14} />
                                    <span>➕ Novo Usuário</span>
                                </button>
                            </div>
                        </div>

                        {isLoadingUsuarios ? (
                            <div className="py-12 text-center text-slate-500 flex flex-col items-center justify-center gap-2">
                                <RefreshCw size={28} className="animate-spin text-emerald-600" />
                                <p className="text-xs font-semibold">Carregando lista de usuários do Firestore...</p>
                            </div>
                        ) : listaUsuarios.length === 0 ? (
                            <p className="text-slate-400 text-sm py-6 text-center">Nenhum usuário cadastrado no banco de dados.</p>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {listaUsuarios.map((u) => {
                                    const isSelf = u.id === currentUser?.uid;
                                    const isPaused = u.status === 'Pausado';

                                    return (
                                        <div 
                                            key={u.id} 
                                            className={`border rounded-2xl p-4 flex flex-col justify-between space-y-4 transition-all ${
                                                isPaused 
                                                    ? 'bg-amber-50/40 border-amber-300 shadow-xs' 
                                                    : 'bg-slate-50 border-slate-200 hover:border-emerald-500 shadow-xs'
                                            }`}
                                        >
                                            {/* CABEÇALHO DO CARD DO USUÁRIO */}
                                            <div className="flex items-start justify-between gap-2">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-10 h-10 rounded-xl text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-xs ${
                                                        isPaused ? 'bg-amber-600' : 'bg-slate-800'
                                                    }`}>
                                                        {u.nome ? u.nome.substring(0, 2).toUpperCase() : 'US'}
                                                    </div>
                                                    <div className="min-w-0">
                                                        <h3 className="font-bold text-slate-800 text-sm truncate flex items-center gap-1.5">
                                                            {u.nome || 'Sem Nome'}
                                                            {isSelf && (
                                                                <span className="text-[10px] font-normal text-emerald-700 bg-emerald-100 px-1.5 py-0.2 rounded border border-emerald-200">(Você)</span>
                                                            )}
                                                        </h3>
                                                        <p className="text-xs text-slate-500 truncate mb-1.5">{u.email}</p>
                                                        
                                                        {/* DESTAQUE DE CELULAR E CRECI PARA VERIFICAÇÃO */}
                                                        <div className="flex items-center gap-1.5 flex-wrap font-bold text-[11px] mt-1">
                                                            {u.celular ? (
                                                                <span className="flex items-center gap-1 bg-emerald-50 text-emerald-800 px-2 py-0.5 rounded-md border border-emerald-200 shadow-2xs">
                                                                    <Phone size={11} className="text-emerald-600 shrink-0" />
                                                                    {u.celular}
                                                                </span>
                                                            ) : (
                                                                <span className="flex items-center gap-1 bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded text-[10px] font-normal border border-slate-200">
                                                                    Sem Tel
                                                                </span>
                                                            )}

                                                            {u.creci ? (
                                                                <span className="flex items-center gap-1 bg-purple-50 text-purple-900 px-2 py-0.5 rounded-md border border-purple-200 shadow-2xs">
                                                                    <Award size={11} className="text-purple-600 shrink-0" />
                                                                    CRECI: {u.creci}
                                                                </span>
                                                            ) : (
                                                                <span className="flex items-center gap-1 bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded text-[10px] font-normal border border-slate-200">
                                                                    Sem CRECI
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* BADGE DE STATUS */}
                                                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold border uppercase shrink-0 flex items-center gap-1 ${
                                                    isPaused 
                                                        ? 'bg-amber-100 text-amber-800 border-amber-300' 
                                                        : 'bg-emerald-100 text-emerald-800 border-emerald-300'
                                                }`}>
                                                    {isPaused ? (
                                                        <>
                                                            <Pause size={10} /> Pausado
                                                        </>
                                                    ) : (
                                                        <>
                                                            <CheckCircle2 size={10} /> Ativo
                                                        </>
                                                    )}
                                                </span>
                                            </div>

                                            {/* SELETOR DE PERFIL (ROLE) */}
                                            <div className="pt-2 border-t border-slate-200/80">
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <label className="text-[11px] font-bold text-slate-600">Perfil de Acesso (Role):</label>
                                                    <span className={`px-2 py-0.5 rounded-md font-bold text-[10px] border ${getBadgeStyle(u.perfil || 'Corretor')}`}>
                                                        {u.perfil || 'Corretor'}
                                                    </span>
                                                </div>
                                                <select 
                                                    value={u.perfil || 'Corretor'}
                                                    onChange={(e) => handleAtualizarPerfilUsuario(u.id, e.target.value)}
                                                    className="w-full px-2.5 py-2 text-xs rounded-xl border border-slate-300 font-semibold bg-white text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-2xs"
                                                >
                                                    <option value="Corretor">Corretor</option>
                                                    <option value="Assistente">Assistente</option>
                                                    <option value="Analista">Analista</option>
                                                    <option value="Gerente">Gerente</option>
                                                    <option value="Administrador">Administrador</option>
                                                </select>
                                            </div>

                                            {/* BOTÕES DE AÇÃO: PAUSAR / REATIVAR & EXCLUIR */}
                                            <div className="pt-2 border-t border-slate-200/80 flex items-center gap-2">
                                                <button
                                                    onClick={() => handleTogglePausarUsuario(u)}
                                                    disabled={isSelf}
                                                    className={`flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 shadow-2xs ${
                                                        isPaused
                                                            ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                                                            : 'bg-amber-500 hover:bg-amber-600 text-white'
                                                    } disabled:opacity-40 disabled:cursor-not-allowed`}
                                                    title={isSelf ? 'Você não pode pausar a sua própria conta' : isPaused ? 'Reativar acesso do usuário' : 'Pausar acesso do usuário'}
                                                >
                                                    {isPaused ? (
                                                        <>
                                                            <Play size={14} />
                                                            Reativar
                                                        </>
                                                    ) : (
                                                        <>
                                                            <Pause size={14} />
                                                            Pausar
                                                        </>
                                                    )}
                                                </button>

                                                <button
                                                    onClick={() => handleExcluirUsuario(u)}
                                                    disabled={isSelf}
                                                    className="py-2 px-3 rounded-xl text-xs font-bold transition-all border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 flex items-center justify-center gap-1.5 shadow-2xs disabled:opacity-40 disabled:cursor-not-allowed"
                                                    title={isSelf ? 'Você não pode excluir a sua própria conta' : 'Excluir usuário permanentemente'}
                                                >
                                                    <Trash2 size={14} />
                                                    <span>Excluir</span>
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                )}

                {/* MODAL PARA CADASTRAR NOVO USUÁRIO (ADMINISTRADOR) */}
                {showModalNovoUsuario && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
                            {/* Cabeçalho do Modal */}
                            <div className="bg-slate-800 text-white px-6 py-4 flex items-center justify-between">
                                <div className="flex items-center gap-2.5">
                                    <div className="bg-emerald-500/20 p-2 rounded-xl border border-emerald-500/30">
                                        <UserPlus size={20} className="text-emerald-400" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base text-white">Cadastrar Novo Usuário</h3>
                                        <p className="text-xs text-slate-300">Criar conta e definir perfil de acesso direto no sistema</p>
                                    </div>
                                </div>
                                <button 
                                    onClick={() => setShowModalNovoUsuario(false)} 
                                    className="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700/50 transition-colors cursor-pointer"
                                >
                                    <X size={20} />
                                </button>
                            </div>

                            {/* Formulário de Cadastro */}
                            <form onSubmit={handleAdminCadastrarUsuario} className="p-6 space-y-4">
                                {adminNovoError && (
                                    <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs font-semibold flex items-start gap-2">
                                        <AlertOctagon size={16} className="shrink-0 mt-0.5 text-rose-600" />
                                        <span>{adminNovoError}</span>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="col-span-1 sm:col-span-2">
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Nome Completo *</label>
                                        <div className="relative">
                                            <User size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="text"
                                                value={adminNovoNome}
                                                onChange={(e) => setAdminNovoNome(e.target.value)}
                                                placeholder="Ex: Carlos Eduardo Silva"
                                                required
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div className="col-span-1 sm:col-span-2">
                                        <label className="block text-xs font-bold text-slate-700 mb-1">E-mail *</label>
                                        <div className="relative">
                                            <Mail size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="email"
                                                value={adminNovoEmail}
                                                onChange={(e) => setAdminNovoEmail(e.target.value)}
                                                placeholder="corretor@empresa.com.br"
                                                required
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Celular / WhatsApp *</label>
                                        <div className="relative">
                                            <Phone size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="tel"
                                                value={adminNovoCelular}
                                                onChange={(e) => setAdminNovoCelular(e.target.value)}
                                                placeholder="(11) 99999-9999"
                                                required
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">
                                            CRECI {adminNovoPerfil === 'Corretor' ? (
                                                <span className="text-emerald-700 font-bold">* (Obrigatório)</span>
                                            ) : (
                                                <span className="text-slate-400 font-normal">(Opcional)</span>
                                            )}
                                        </label>
                                        <div className="relative">
                                            <Award size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="text"
                                                value={adminNovoCreci}
                                                onChange={(e) => setAdminNovoCreci(e.target.value)}
                                                placeholder="12345-F"
                                                required={adminNovoPerfil === 'Corretor'}
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Senha de Acesso *</label>
                                        <div className="relative">
                                            <Lock size={16} className="absolute left-3 top-3 text-slate-400" />
                                            <input 
                                                type="password"
                                                value={adminNovoSenha}
                                                onChange={(e) => setAdminNovoSenha(e.target.value)}
                                                placeholder="Mínimo 6 caracteres"
                                                required
                                                minLength={6}
                                                className="w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-medium text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Perfil de Acesso (Role) *</label>
                                        <select 
                                            value={adminNovoPerfil}
                                            onChange={(e) => setAdminNovoPerfil(e.target.value)}
                                            className="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-semibold text-slate-800 bg-white"
                                        >
                                            <option value="Corretor">Corretor</option>
                                            <option value="Assistente">Assistente</option>
                                            <option value="Analista">Analista</option>
                                            <option value="Gerente">Gerente</option>
                                            <option value="Administrador">Administrador</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                                    <button 
                                        type="button"
                                        onClick={() => setShowModalNovoUsuario(false)}
                                        className="px-4 py-2.5 text-xs font-bold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors cursor-pointer"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        type="submit"
                                        disabled={adminNovoSubmitting}
                                        className="px-5 py-2.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl transition-all shadow-md flex items-center gap-2 disabled:opacity-50 cursor-pointer"
                                    >
                                        {adminNovoSubmitting ? (
                                            <>
                                                <RefreshCw size={14} className="animate-spin" />
                                                Cadastrando...
                                            </>
                                        ) : (
                                            <>
                                                <UserPlus size={16} />
                                                Cadastrar Usuário
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
