        const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></Icon>;
        const Shield = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></Icon>;
        const Users = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
        const Mail = (p) => <Icon {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>;
        const Lock = (p) => <Icon {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
        const BarChart2 = (p) => <Icon {...p}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></Icon>;
        const AlertOctagon = (p) => <Icon {...p}><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
        const Pause = (p) => <Icon {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></Icon>;
        const Play = (p) => <Icon {...p}><polygon points="5 3 19 12 5 21 5 3"/></Icon>;
        const UserCheck = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></Icon>;
        const UserX = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/></Icon>;
        const UserPlus = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="16" x2="22" y1="11" y2="11"/></Icon>;
        const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
        const Phone = (p) => <Icon {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></Icon>;
        const Award = (p) => <Icon {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></Icon>;

        // ==========================================
        // COMPONENTE DE INPUT DE MOEDA (BRL)
        // ==========================================
        const MoneyInput = ({ label, value, onChange, placeholder = "0,00", helpText, id }) => {
            const [focused, setFocused] = useState(false);
            const [displayVal, setDisplayVal] = useState('');

            useEffect(() => {
                if (!focused) {
                    if (value === '' || value === null || value === undefined || isNaN(value)) {
                        setDisplayVal('');
                    } else {
                        const num = parseFloat(value);
                        setDisplayVal(num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                    }
                }
            }, [value, focused]);

            const handleFocus = () => {
                setFocused(true);
                if (value !== '' && value !== null && !isNaN(value)) {
                    setDisplayVal(String(value).replace('.', ','));
                }
            };

            const handleChange = (e) => {
                const raw = e.target.value;
                setDisplayVal(raw);
                
                if (!raw.trim()) {
                    onChange('');
                    return;
                }

                const cleanStr = raw.replace(/\./g, '').replace(',', '.');
                const parsed = parseFloat(cleanStr);
                if (!isNaN(parsed)) {
                    onChange(parsed);
                } else {
                    onChange('');
                }
            };

            const handleBlur = () => {
                setFocused(false);
                const num = parseFloat(value);
                if (!isNaN(num) && value !== '') {
                    setDisplayVal(num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                } else {
                    setDisplayVal('');
                }
            };

            return (
                <div>
                    {label && <label className="block text-sm font-semibold text-slate-700 mb-1">{label}</label>}
                    <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">R$</span>
                        <input 
                            type="text" 
                            id={id}
                            value={displayVal} 
                            onChange={handleChange}
                            onFocus={handleFocus}
                            onBlur={handleBlur}
                            placeholder={placeholder}
                            className="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none transition-all font-semibold text-slate-800"
                        />
                    </div>
                    {helpText && <p className="text-xs text-slate-500 mt-1">{helpText}</p>}
                </div>
            );
        };

        // ==========================================
        // APLICAÇÃO PRINCIPAL
        // ==========================================
        function App() {
            // Estados para os inputs do usuário
            const [financiamento, setFinanciamento] = useState('');
            const [taxaAnual, setTaxaAnual] = useState('');
            const [percTerreno, setPercTerreno] = useState('6.9'); // Valor fixo por padrão em 6,9%
            const [percObra, setPercObra] = useState('');
            const [parcelaFutura, setParcelaFutura] = useState('');
            const [seguro, setSeguro] = useState('');
            
            // Estados para a API do Banco Central (TR)
            const [tr, setTr] = useState(0);
            const [trData, setTrData] = useState('Buscando...');
            const [isFetchingTr, setIsFetchingTr] = useState(true);

            // Estados do Firestore (Simulações Salvas)
            const [nomeSimulacao, setNomeSimulacao] = useState('');
            const [simulacoes, setSimulacoes] = useState([]);
            const [isSaving, setIsSaving] = useState(false);
            const [isLoadingSimulacoes, setIsLoadingSimulacoes] = useState(true);
            const [feedback, setFeedback] = useState(null);

            // Estados de Autenticação e Perfis de Usuário (RBAC)
            const [currentUser, setCurrentUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            // Estados do formulário de Login / Cadastro
            const [isRegistering, setIsRegistering] = useState(false);
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authNome, setAuthNome] = useState('');
            const [authCelular, setAuthCelular] = useState('');
            const [authCreci, setAuthCreci] = useState('');
            const [authPerfil, setAuthPerfil] = useState('Corretor'); // 'Corretor' | 'Gerente' | 'Administrador'
            const [authError, setAuthError] = useState('');
            const [authSubmitting, setAuthSubmitting] = useState(false);

            // Estados para Gestão de Usuários (Administrador)
            const [listaUsuarios, setListaUsuarios] = useState([]);
            const [isLoadingUsuarios, setIsLoadingUsuarios] = useState(false);
            const [showModalNovoUsuario, setShowModalNovoUsuario] = useState(false);
            const [adminNovoNome, setAdminNovoNome] = useState('');
            const [adminNovoEmail, setAdminNovoEmail] = useState('');
            const [adminNovoCelular, setAdminNovoCelular] = useState('');
            const [adminNovoCreci, setAdminNovoCreci] = useState('');
            const [adminNovoSenha, setAdminNovoSenha] = useState('');
            const [adminNovoPerfil, setAdminNovoPerfil] = useState('Corretor');
            const [adminNovoError, setAdminNovoError] = useState('');
            const [adminNovoSubmitting, setAdminNovoSubmitting] = useState(false);

            // Taxa de administração fixa conforme regra da CEF
            const TAXA_ADM = 25.00;

            // Monitora estado de autenticação do Firebase
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (user) => {
                    setCurrentUser(user);
                    if (user) {
                        try {
                            const userDocRef = doc(db, 'usuarios', user.uid);
                            const userSnap = await getDoc(userDocRef);
                            if (userSnap.exists()) {
                                setUserData(userSnap.data());
                            } else {
                                const defaultProfile = {
                                    nome: user.displayName || user.email.split('@')[0],
                                    email: user.email,
                                    perfil: 'Corretor',
                                    status: 'Ativo',
                                    uid: user.uid,
                                    criadoEm: serverTimestamp()
                                };
                                await setDoc(userDocRef, defaultProfile);
                                setUserData(defaultProfile);
                            }
                        } catch (err) {
                            console.error("Erro ao carregar perfil do usuário:", err);
                            setUserData({ nome: user.email, email: user.email, perfil: 'Corretor', status: 'Ativo', uid: user.uid });
                        }
                    } else {
                        setUserData(null);
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Carrega lista de usuários para o perfil Administrador
            useEffect(() => {
                if (userData && userData.perfil === 'Administrador') {
                    setIsLoadingUsuarios(true);
                    const unsubscribe = onSnapshot(collection(db, 'usuarios'), (snapshot) => {
                        const usersArr = [];
                        snapshot.forEach((docSnap) => {
                            usersArr.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setListaUsuarios(usersArr);
                        setIsLoadingUsuarios(false);
                    }, (err) => {
                        console.error("Erro ao carregar usuários:", err);
                        setIsLoadingUsuarios(false);
                    });
                    return () => unsubscribe();
                }
            }, [userData]);

            // Busca a TR na API do Banco Central na inicialização
            useEffect(() => {
                fetchTR();
            }, []);

            // Carrega as simulações salvas do Firestore em tempo real
            useEffect(() => {
                setIsLoadingSimulacoes(true);
                try {
                    const q = query(collection(db, 'simulacoes'), orderBy('criadoEm', 'desc'));
                    const unsubscribe = onSnapshot(q, (snapshot) => {
                        const lista = [];
                        snapshot.forEach((docSnap) => {
                            lista.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setSimulacoes(lista);
                        setIsLoadingSimulacoes(false);
                    }, (error) => {
                        console.error('Erro no snapshot de simulações com ordem:', error);
                        // Fallback sem ordenação caso o índice esteja em criação
                        onSnapshot(collection(db, 'simulacoes'), (snapshot) => {
                            const lista = [];
                            snapshot.forEach((docSnap) => {
                                lista.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            setSimulacoes(lista);
                            setIsLoadingSimulacoes(false);
                        });
                    });
                    return () => unsubscribe();
                } catch (err) {
                    console.error('Erro ao conectar ao Firestore:', err);
                    setIsLoadingSimulacoes(false);
                }
            }, []);

            const fetchTR = async () => {
                setIsFetchingTr(true);
                try {
                    let response = await fetch('/api/tr').catch(() => null);
                    if (!response || !response.ok) {
                        response = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.226/dados/ultimos/1?formato=json');
                    }
                    const data = await response.json();
                    if (data && data.length > 0) {
                        setTr(parseFloat(data[0].valor));
                        setTrData(data[0].data);
                    }
                } catch (error) {
                    console.error('Erro ao buscar TR:', error);
                    setTr(0.10);
                    setTrData('Fallback');
                }
                finally {
                    setIsFetchingTr(false);
                }
            };

            // Handlers de Autenticação
            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                if (!authEmail.trim() || !authPassword) {
                    setAuthError('Preencha e-mail e senha para acessar.');
                    return;
                }
                setAuthSubmitting(true);
                try {
                    await signInWithEmailAndPassword(auth, authEmail.trim(), authPassword);
                    setAuthEmail('');
                    setAuthPassword('');
                } catch (err) {
                    console.error("Erro de Login:", err);
                    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                        setAuthError('E-mail ou senha incorretos.');
                    } else if (err.code === 'auth/invalid-email') {
                        setAuthError('Formato de e-mail inválido.');
                    } else if (err.code === 'auth/too-many-requests') {
                        setAuthError('Muitas tentativas sem sucesso. Tente novamente mais tarde.');
                    } else {
                        setAuthError(`Erro ao entrar: ${err.message || err.code || 'Falha de autenticação.'}`);
                    }
                } finally {
                    setAuthSubmitting(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthError('');
                if (!authNome.trim()) {
                    setAuthError('Informe o seu Nome Completo.');
                    return;
                }
                if (!authEmail.trim()) {
                    setAuthError('Informe o seu E-mail.');
                    return;
                }
                if (!authCelular.trim()) {
                    setAuthError('Informe o seu Celular / WhatsApp.');
                    return;
                }
                if (!authCreci.trim()) {
                    setAuthError('Informe o seu registro CRECI.');
                    return;
                }
                if (!authPassword || authPassword.length < 6) {
                    setAuthError('A senha deve ter no mínimo 6 caracteres.');
                    return;
                }
                setAuthSubmitting(true);
                try {
                    // 1. Cria conta no Firebase Authentication
                    const userCred = await createUserWithEmailAndPassword(auth, authEmail.trim(), authPassword);
                    const user = userCred.user;

                    // 2. Atualiza o perfil do Firebase Auth (displayName)
                    try {
                        await updateProfile(user, { displayName: authNome.trim() });
                    } catch (pErr) {
                        console.warn("Aviso ao atualizar displayName no Auth:", pErr);
                    }
                    
                    // 3. Salva os dados estendidos do usuário e perfil no Firestore (coleção 'usuarios')
                    const profileData = {
                        nome: authNome.trim(),
                        email: authEmail.trim(),
                        celular: authCelular.trim(),
                        creci: authCreci.trim(),
                        perfil: authPerfil,
                        status: 'Ativo',
                        uid: user.uid,
                        criadoEm: serverTimestamp()
                    };
                    
                    await setDoc(doc(db, 'usuarios', user.uid), profileData);
                    
                    // 4. Atualiza os estados locais para liberação e navegação imediata
                    setUserData(profileData);
                    setCurrentUser(user);
                    setAuthEmail('');
                    setAuthPassword('');
                    setAuthNome('');
                    setAuthCelular('');
                    setAuthCreci('');
                } catch (err) {
                    console.error("Erro no Cadastro:", err);
                    if (err.code === 'auth/email-already-in-use') {
                        setAuthError('Este e-mail já está cadastrado no sistema.');
                    } else if (err.code === 'auth/weak-password') {
                        setAuthError('A senha deve ter pelo menos 6 caracteres.');
                    } else if (err.code === 'auth/invalid-email') {
                        setAuthError('O e-mail digitado é inválido.');
                    } else if (err.code === 'auth/operation-not-allowed') {
                        setAuthError('O método de autenticação por E-mail/Senha não está ativado no Firebase.');
                    } else {
                        setAuthError(`Erro no cadastro: ${err.message || err.code || 'Ocorreu uma falha ao criar a conta.'}`);
                    }
                } finally {
                    setAuthSubmitting(false);
                }
            };

            const handleLogout = async () => {
                try {
                    await signOut(auth);
                } catch (err) {
                    console.error("Erro no logout:", err);
                }
            };

            const getBadgeStyle = (perfil) => {
                switch (perfil) {
                    case 'Administrador': return 'bg-emerald-100 text-emerald-800 border-emerald-300';
                    case 'Gerente': return 'bg-purple-100 text-purple-800 border-purple-300';
                    case 'Analista': return 'bg-amber-100 text-amber-800 border-amber-300';
                    case 'Assistente': return 'bg-sky-100 text-sky-800 border-sky-300';
                    case 'Corretor': default: return 'bg-indigo-100 text-indigo-800 border-indigo-300';
                }
            };

            const handleAtualizarPerfilUsuario = async (userId, novoPerfil) => {
                try {
                    await updateDoc(doc(db, 'usuarios', userId), { perfil: novoPerfil });
                    setFeedback({ text: `Perfil do usuário atualizado para "${novoPerfil}"!`, type: 'success' });
                    setTimeout(() => setFeedback(null), 3500);
                } catch (err) {
                    console.error("Erro ao alterar perfil:", err);
                    alert("Erro ao alterar perfil do usuário.");
                }
            };

            const handleTogglePausarUsuario = async (u) => {
                if (u.id === currentUser?.uid) {
                    alert("Você não pode pausar a sua própria conta.");
                    return;
                }
                const novoStatus = u.status === 'Pausado' ? 'Ativo' : 'Pausado';
                try {
                    await updateDoc(doc(db, 'usuarios', u.id), { status: novoStatus });
                    setFeedback({ 
                        text: `Usuário "${u.nome || u.email}" alterado para "${novoStatus}"! ${novoStatus === 'Pausado' ? 'O acesso deste usuário foi temporariamente bloqueado.' : 'Acesso liberado.'}`, 
                        type: novoStatus === 'Pausado' ? 'error' : 'success' 
                    });
                    setTimeout(() => setFeedback(null), 3500);
                } catch (err) {
                    console.error("Erro ao alterar status do usuário:", err);
                    alert("Erro ao atualizar status no banco de dados.");
                }
            };

            const handleExcluirUsuario = async (u) => {
                if (u.id === currentUser?.uid) {
                    alert("Você não pode excluir a sua própria conta.");
                    return;
                }
                if (window.confirm(`Tem certeza que deseja EXCLUIR permanentemente o usuário "${u.nome || u.email}" (${u.email})?`)) {
                    try {
                        await deleteDoc(doc(db, 'usuarios', u.id));
                        setFeedback({ text: `Usuário "${u.nome || u.email}" foi excluído do sistema.`, type: 'info' });
                        setTimeout(() => setFeedback(null), 3500);
                    } catch (err) {
                        console.error("Erro ao excluir usuário:", err);
                        alert("Erro ao excluir usuário no banco de dados.");
                    }
                }
            };

            const handleAdminCadastrarUsuario = async (e) => {
                e.preventDefault();
                setAdminNovoError('');

                if (!adminNovoNome.trim()) {
                    setAdminNovoError('Informe o Nome Completo.');
                    return;
                }
                if (!adminNovoEmail.trim()) {
                    setAdminNovoError('Informe o E-mail do usuário.');
                    return;
                }
                if (!adminNovoCelular.trim()) {
                    setAdminNovoError('Informe o Celular / WhatsApp do usuário.');
                    return;
                }
                if (adminNovoPerfil === 'Corretor' && !adminNovoCreci.trim()) {
                    setAdminNovoError('O registro CRECI é OBRIGATÓRIO para o perfil de Corretor.');
                    return;
                }
                if (!adminNovoSenha || adminNovoSenha.length < 6) {
                    setAdminNovoError('A Senha deve ter no mínimo 6 caracteres.');
                    return;
                }

                setAdminNovoSubmitting(true);
                try {
                    // Instância secundária para não interromper a sessão ativa do Admin logado
                    const appName = "AdminUserApp_" + Date.now();
                    const secondaryApp = initializeApp(firebaseConfig, appName);
                    const secondaryAuth = getAuth(secondaryApp);

                    const userCred = await createUserWithEmailAndPassword(secondaryAuth, adminNovoEmail.trim(), adminNovoSenha);
                    const newUser = userCred.user;

                    try {
                        await updateProfile(newUser, { displayName: adminNovoNome.trim() });
                    } catch (pErr) {
                        console.warn("Aviso ao atualizar displayName:", pErr);
                    }

                    const newUserProfile = {
                        nome: adminNovoNome.trim(),
                        email: adminNovoEmail.trim(),
                        celular: adminNovoCelular.trim() || '',
                        creci: adminNovoCreci.trim() || '',
                        perfil: adminNovoPerfil,
                        status: 'Ativo',
                        uid: newUser.uid,
                        criadoEm: serverTimestamp()
                    };

                    await setDoc(doc(db, 'usuarios', newUser.uid), newUserProfile);
                    await signOut(secondaryAuth);

                    setFeedback({ 
                        text: `Usuário "${adminNovoNome.trim()}" (${adminNovoPerfil}) cadastrado com sucesso!`, 
                        type: 'success' 
                    });
                    setTimeout(() => setFeedback(null), 4000);

                    // Limpar formulário e fechar modal
                    setAdminNovoNome('');
                    setAdminNovoEmail('');
                    setAdminNovoCelular('');
                    setAdminNovoCreci('');
                    setAdminNovoSenha('');
                    setAdminNovoPerfil('Corretor');
                    setShowModalNovoUsuario(false);
                } catch (err) {
                    console.error("Erro ao cadastrar usuário via Admin:", err);
                    if (err.code === 'auth/email-already-in-use') {
                        setAdminNovoError('Este e-mail já está cadastrado no sistema.');
                    } else if (err.code === 'auth/invalid-email') {
                        setAdminNovoError('O e-mail digitado é inválido.');
                    } else if (err.code === 'auth/weak-password') {
                        setAdminNovoError('A senha deve ter no mínimo 6 caracteres.');
                    } else {
                        setAdminNovoError(`Erro no cadastro: ${err.message || err.code || 'Falha ao criar conta.'}`);
                    }
                } finally {
                    setAdminNovoSubmitting(false);
                }
            };

            // Função para limpar todos os campos
            const handleReset = () => {
                setFinanciamento('');
                setTaxaAnual('');
                setPercTerreno('6.9');
                setPercObra('');
                setParcelaFutura('');
                setSeguro('');
                setNomeSimulacao('');
                fetchTR();
            };

            // Funções utilitárias de formatação
            const formatCurrency = (value) => {
                const num = parseFloat(value);
                if (isNaN(num)) return 'R$ 0,00';
                return new Intl.NumberFormat('pt-BR', { 
                    style: 'currency', 
                    currency: 'BRL',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(num);
            };
            
            const formatPercent = (value, decimals = 2) => {
                const num = parseFloat(value);
                if (isNaN(num)) return '0,00%';
                return `${num.toLocaleString('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}%`;
            };

            // ==========================================
            // MOTOR DE CÁLCULO
            // ==========================================
            const percTotalLiberado = parseFloat(percTerreno || 0) + parseFloat(percObra || 0);
            const saldoLiberado = parseFloat(financiamento || 0) * (percTotalLiberado / 100);
            
            const taxaMensal = parseFloat(taxaAnual || 0) / 12;
            const valorJuros = saldoLiberado * (taxaMensal / 100);
            const valorTr = saldoLiberado * (parseFloat(tr || 0) / 100);
            
            const totalParcela = valorJuros + valorTr + parseFloat(seguro || 0) + TAXA_ADM;
            const tetoAlcancado = parcelaFutura > 0 ? (totalParcela / parcelaFutura) * 100 : 0;

            // ==========================================
            // AÇÕES DO FIRESTORE (SALVAR, CARREGAR, EXCLUIR)
            // ==========================================
            const handleSalvarSimulacao = async () => {
                if (!financiamento || parseFloat(financiamento) <= 0) {
                    alert('Por favor, informe o Valor do Financiamento antes de salvar.');
                    return;
                }

                setIsSaving(true);
                try {
                    const agora = new Date();
                    const dataTexto = agora.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    const tituloFinal = nomeSimulacao.trim() 
                        ? nomeSimulacao.trim() 
                        : `Simulação ${formatCurrency(financiamento)} (${dataTexto})`;

                    const payload = {
                        titulo: tituloFinal,
                        financiamento: parseFloat(financiamento || 0),
                        taxaAnual: parseFloat(taxaAnual || 0),
                        percTerreno: parseFloat(percTerreno || 0),
                        percObra: parseFloat(percObra || 0),
                        parcelaFutura: parseFloat(parcelaFutura || 0),
                        seguro: parseFloat(seguro || 0),
                        tr: parseFloat(tr || 0),
                        totalParcela: totalParcela || 0,
                        saldoLiberado: saldoLiberado || 0,
                        valorJuros: valorJuros || 0,
                        valorTr: valorTr || 0,
                        criadoPorUid: currentUser ? currentUser.uid : null,
                        criadoPorNome: userData ? userData.nome : (currentUser ? currentUser.email : 'Usuário'),
                        criadoPorPerfil: userData ? userData.perfil : 'Corretor',
                        criadoEm: serverTimestamp(),
                        dataTexto: dataTexto
                    };

                    await addDoc(collection(db, 'simulacoes'), payload);
                    
                    setNomeSimulacao('');
                    setFeedback({ text: 'Simulação salva no Firestore com sucesso!', type: 'success' });
                    setTimeout(() => setFeedback(null), 4000);
                } catch (error) {
                    console.error('Erro ao salvar no Firestore:', error);
                    setFeedback({ text: 'Erro ao salvar simulação. Tente novamente.', type: 'error' });
                    setTimeout(() => setFeedback(null), 4000);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleCarregarSimulacao = (item) => {
                setFinanciamento(item.financiamento !== undefined ? String(item.financiamento) : '');
                setTaxaAnual(item.taxaAnual !== undefined ? String(item.taxaAnual) : '');
                setPercTerreno(item.percTerreno !== undefined ? String(item.percTerreno) : '6.9');
                setPercObra(item.percObra !== undefined ? String(item.percObra) : '');
                setParcelaFutura(item.parcelaFutura !== undefined ? String(item.parcelaFutura) : '');
                setSeguro(item.seguro !== undefined ? String(item.seguro) : '');
                if (item.tr !== undefined) setTr(item.tr);

                window.scrollTo({ top: 0, behavior: 'smooth' });
                setFeedback({ text: `Simulação "${item.titulo}" carregada na calculadora!`, type: 'info' });
                setTimeout(() => setFeedback(null), 4000);
            };

            const handleExcluirSimulacao = async (id, titulo) => {
                if (window.confirm(`Deseja excluir permanentemente a simulação "${titulo}"?`)) {
                    try {
                        await deleteDoc(doc(db, 'simulacoes', id));
                        setFeedback({ text: 'Simulação excluída do Firestore.', type: 'info' });
                        setTimeout(() => setFeedback(null), 3000);
                    } catch (error) {
                        console.error('Erro ao excluir simulação:', error);
                        alert('Erro ao excluir a simulação do banco de dados.');
                    }
                }
            };

            // RENDERIZAÇÃO 1: CARREGANDO AUTENTICAÇÃO
            if (authLoading) {
                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-center p-4">
                        <RefreshCw size={36} className="animate-spin text-[#1D8843] mb-3" />
                        <p className="text-slate-600 font-bold text-base">Carregando dados do sistema...</p>
                    </div>
                );
            }

            // RENDERIZAÇÃO 1.5: TELA DE CONTA SUSPENSA / PAUSADA
            if (currentUser && userData && userData.status === 'Pausado') {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-200 text-center p-8">
                            <div className="bg-amber-100 text-amber-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-300 shadow-sm">
                                <AlertOctagon size={36} />
                            </div>
                            <h2 className="text-2xl font-black text-slate-800 mb-2">Conta Suspensa / Pausada</h2>
                            <p className="text-slate-600 text-sm mb-6 leading-relaxed">
                                Olá <strong className="text-slate-800">{userData.nome || currentUser.email}</strong>, seu acesso ao aplicativo está temporariamente <strong>pausado</strong> pelo Administrador.
                            </p>
                            <div className="p-4 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-800 font-semibold mb-6">
                                Entre em contato com o <strong>Administrador</strong> do sistema para solicitar a liberação da sua conta.
                            </div>
                            <button 
                                onClick={handleLogout}
                                className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-sm"
                            >
                                <LogOut size={18} />
                                Sair da Conta
                            </button>
                        </div>
                    </div>
                );
            }

            // RENDERIZAÇÃO 2: TELA DE LOGIN / CADASTRO SE NÃO ESTIVER AUTENTICADO
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="bg-gradient-to-r from-[#05532C] to-[#1D8843] p-6 text-white text-center">
                                <div className="bg-white/10 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur border border-white/20 shadow-sm">
                                    <HardHat size={36} className="text-white" />
                                </div>
                                <h1 className="text-2xl font-black tracking-tight">AppJurosObra</h1>
                                <p className="text-emerald-100 text-xs mt-1 font-medium">Calculadora e Gestão de Juros de Obra - CEF</p>
                            </div>

                            <div className="flex border-b border-slate-200 bg-slate-50">
                                <button 
                                    type="button"
                                    onClick={() => { setIsRegistering(false); setAuthError(''); }}
                                    className={`flex-1 py-3 text-sm font-bold transition-all border-b-2 flex items-center justify-center gap-2 ${!isRegistering ? 'border-[#1D8843] text-[#05532C] bg-white' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                                >
                                    <User size={16} />
                                    Entrar
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => { setIsRegistering(true); setAuthError(''); }}
                                    className={`flex-1 py-3 text-sm font-bold transition-all border-b-2 flex items-center justify-center gap-2 ${isRegistering ? 'border-[#1D8843] text-[#05532C] bg-white' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                                >
                                    <Shield size={16} />
                                    Criar Conta
                                </button>
                            </div>

                            <div className="p-6">
                                {authError && (
                                    <div className="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs font-semibold flex items-center gap-2">
                                        <Info size={16} className="shrink-0 text-rose-500" />
                                        <span>{authError}</span>
                                    </div>
                                )}

                                {!isRegistering ? (
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">E-mail</label>
                                            <div className="relative">
                                                <Mail className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                <input 
                                                    type="email" 
                                                    required
                                                    placeholder="seu@email.com"
                                                    value={authEmail}
                                                    onChange={(e) => setAuthEmail(e.target.value)}
                                                    className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-medium"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Senha</label>
                                            <div className="relative">
                                                <Lock className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                <input 
                                                    type="password" 
                                                    required
                                                    placeholder="••••••••"
                                                    value={authPassword}
                                                    onChange={(e) => setAuthPassword(e.target.value)}
                                                    className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-medium"
                                                />
                                            </div>
                                        </div>

                                        <button 
                                            type="submit"
                                            disabled={authSubmitting}
                                            className="w-full mt-2 bg-[#1D8843] hover:bg-[#05532C] text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                                        >
                                            <User size={18} />
                                            {authSubmitting ? 'Acessando...' : 'Entrar no Sistema'}
                                        </button>
                                    </form>
                                ) : (
                                    <form onSubmit={handleRegister} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Nome Completo *</label>
                                            <div className="relative">
                                                <User className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                <input 
                                                    type="text" 
                                                    required
                                                    placeholder="Ex: João da Silva"
                                                    value={authNome}
                                                    onChange={(e) => setAuthNome(e.target.value)}
                                                    className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-medium text-slate-800"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">E-mail *</label>
                                            <div className="relative">
                                                <Mail className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                <input 
                                                    type="email" 
                                                    required
                                                    placeholder="seu@email.com"
                                                    value={authEmail}
                                                    onChange={(e) => setAuthEmail(e.target.value)}
                                                    className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-medium text-slate-800"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Celular / WhatsApp *</label>
                                                <div className="relative">
                                                    <Phone className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                    <input 
                                                        type="tel" 
                                                        required
                                                        placeholder="(11) 99999-9999"
                                                        value={authCelular}
                                                        onChange={(e) => setAuthCelular(e.target.value)}
                                                        className="w-full pl-10 pr-3 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-medium text-slate-800"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">CRECI *</label>
                                                <div className="relative">
                                                    <Award className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                    <input 
                                                        type="text" 
                                                        required
                                                        placeholder="12345-F"
                                                        value={authCreci}
                                                        onChange={(e) => setAuthCreci(e.target.value)}
                                                        className="w-full pl-10 pr-3 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-medium text-slate-800"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Senha * (Mínimo 6 caracteres)</label>
                                            <div className="relative">
                                                <Lock className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                <input 
                                                    type="password" 
                                                    required
                                                    placeholder="••••••••"
                                                    value={authPassword}
                                                    onChange={(e) => setAuthPassword(e.target.value)}
                                                    className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-medium text-slate-800"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Perfil de Usuário (Permissão)</label>
                                            <select 
                                                value={authPerfil}
                                                onChange={(e) => setAuthPerfil(e.target.value)}
                                                className="w-full px-3 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#1D8843] focus:border-[#1D8843] outline-none font-semibold text-slate-800 bg-white"
                                            >
                                                <option value="Corretor">Corretor (Simulações e atendimento)</option>
                                                <option value="Assistente">Assistente (Realiza e visualiza simulações)</option>
                                                <option value="Analista">Analista (Simulações, edições e relatórios)</option>
                                                <option value="Gerente">Gerente (Simulações, salvamento e relatórios)</option>
                                                <option value="Administrador">Administrador (Gestão de usuários e acesso total)</option>
                                            </select>
                                        </div>

                                        <button 
                                            type="submit"
                                            disabled={authSubmitting}
                                            className="w-full mt-2 bg-[#1D8843] hover:bg-[#05532C] text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                                        >
                                            <Shield size={18} />
                                            {authSubmitting ? 'Cadastrando...' : 'Criar Minha Conta'}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDERIZAÇÃO 3: APLICAÇÃO PRINCIPAL (USUÁRIO AUTENTICADO)
            return (
                <div className="min-h-screen p-4 md:p-8 font-sans text-slate-800 bg-slate-100">
                
                {/* HEADER COM IDENTIFICAÇÃO DO USUÁRIO LOGADO E LOGOUT */}
                <div className="max-w-[1600px] mx-auto mb-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                        <div className="bg-[#1D8843] p-3 rounded-xl text-white shadow-sm shrink-0">
                            <HardHat size={32} />
                        </div>
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black text-[#05532C] tracking-tight">Simulador de Juros de Obra</h1>
                            <p className="text-slate-600 text-sm md:text-base">Evolução de obra da Caixa - Modelo Apoio à Produção</p>
                        </div>
                    </div>

                    {/* BADGE DE USUÁRIO LOGADO E BOTÃO LOGOUT */}
                    <div className="flex items-center gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-200 self-start md:self-auto shrink-0">
                        <div className="flex items-center gap-2.5 pl-1 pr-1">
                            <div className="w-9 h-9 rounded-lg bg-[#05532C] text-white flex items-center justify-center font-bold text-sm shadow-xs shrink-0">
                                {userData?.nome ? userData.nome.substring(0, 2).toUpperCase() : 'US'}
                            </div>
                            <div className="text-xs">
                                <p className="font-bold text-slate-800 leading-tight">
                                    {userData?.nome || currentUser.email}
                                </p>
                                <div className="mt-0.5 flex items-center gap-1.5">
                                    <span className="text-slate-500">Perfil:</span>
                                    <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] uppercase border ${getBadgeStyle(userData?.perfil || 'Corretor')}`}>
                                        {userData?.perfil || 'Corretor'}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <button 
                            onClick={handleLogout}
                            title="Sair do Sistema"
                            className="bg-white hover:bg-rose-50 text-slate-600 hover:text-rose-600 p-2 rounded-lg border border-slate-200 transition-colors flex items-center gap-1.5 text-xs font-bold"
                        >
                            <LogOut size={16} />
                            <span className="hidden sm:inline">Sair</span>
                        </button>
                    </div>
                </div>

                {/* BANNER DE FEEDBACK */}
                {feedback && (
                    <div className={`max-w-[1600px] mx-auto mb-6 p-4 rounded-xl font-semibold flex items-center gap-3 shadow-sm ${
                        feedback.type === 'success' ? 'bg-emerald-100 border border-emerald-300 text-emerald-800' :
                        feedback.type === 'error' ? 'bg-rose-100 border border-rose-300 text-rose-800' :
